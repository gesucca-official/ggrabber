name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -v ./...
      - name: Smoke test dell'eseguibile
        shell: bash
        run: |
          go build -o ggr .
          ./ggr --version
          # senza terminale e senza token deve fermarsi con un errore chiaro, non bloccarsi
          out=$(./ggr --dir "$RUNNER_TEMP/bk" --no-pause < /dev/null 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "nessun login disponibile"
